version: 2

project_name: rootly-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: rootly
    main: ./cmd/rootly
    binary: rootly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    flags:
      - -trimpath
    mod_timestamp: "{{.CommitTimestamp}}"


archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE.txt

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

brews:
  - name: rootly-cli
    ids: [rootly]
    repository:
      owner: rootlyhq
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://rootly.com"
    description: "Rootly CLI for managing incidents, alerts, and workflows"
    install: |
      bin.install "rootly"
    test: |
      system "#{bin}/rootly", "version"


release:
  github:
    owner: rootlyhq
    name: rootly-cli
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{ .Version }}"
